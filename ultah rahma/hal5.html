<!DOCTYPE html>
<html>
<head>
  <title>My Favorite Girl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Perempuan favoritku 💖</h1>

  <div class="grid">
    <img src="rahma1.jpeg" class="bulat">
    <img src="rahma2.jpeg" class="bulat">
    <img src="rahma3.jpeg" class="bulat">
  </div>

  <a href="terakhir.html" class="btn">Terakhir yaaa 💗</a>
</div>

<script>
document.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    document.body.classList.add('fade-out');
    setTimeout(() => {
      window.location.href = this.href;
    }, 600);
  });
});
</script>

</body>
</html>
